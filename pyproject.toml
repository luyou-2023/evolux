[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evolux"
version = "0.2.0"
description = "A self-evolving multi-agent runtime with orchestrator and domain experts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "certifi>=2024.2.2",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "pytest-aiohttp==1.1.0",
  "pytest-timeout==2.4.0",
  "aiohttp==3.13.3",
  "ruff==0.15.10",
]
gateway = [
  "aiohttp==3.13.3",
]

[project.scripts]
evolux = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "cli*", "gateway*", "tools*", "mcp*", "skills*", "acp*", "cron*", "locales*", "vector*"]

[tool.setuptools]
py-modules = ["run_agent", "evolux_state", "evolux_constants", "evolux_env", "evolux_logging"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
timeout = 30
asyncio_mode = "auto"
markers = [
    "live: calls real LLM API (DeepSeek/OpenAI); requires DEEPSEEK_API_KEY",
]

[tool.ruff]
line-length = 100
target-version = "py311"
