[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evolux"
version = "0.1.0"
description = "A self-evolving multi-agent runtime with orchestrator and domain experts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pytest-timeout==2.4.0",
  "ruff==0.15.10",
]

[project.scripts]
evolux = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "cli*", "gateway*", "tools*", "mcp*", "skills*", "acp*", "cron*", "locales*", "vector*"]

[tool.setuptools]
py-modules = ["run_agent", "evolux_state", "evolux_constants"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
timeout = 30

[tool.ruff]
line-length = 100
target-version = "py311"
